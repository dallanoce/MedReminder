name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The release APK is unsigned here: keystore.properties stays on the developer's machine
      # (see docs/RELEASE.md). Building it still checks R8 shrinking.
      - name: Build debug and release APKs, run lint
        run: ./gradlew assembleDebug assembleRelease lintRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: medreminder-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
